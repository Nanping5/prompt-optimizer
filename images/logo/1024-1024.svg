<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!--
    Lobe UI Clerk avatar mark.
    Source: https://ui.lobehub.com/components/icons/clerk
    The underlying Clerk glyph is kept unmodified and centered on a rounded app tile.
  -->
  <defs>
    <linearGradient id="clerk-tile" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C66FF"/>
      <stop offset="0.52" stop-color="#654BF6"/>
      <stop offset="1" stop-color="#5538E8"/>
    </linearGradient>
    <linearGradient id="clerk-sheen" x1="512" y1="64" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="clerk-shadow" x="80" y="96" width="864" height="896" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="36" stdDeviation="44" flood-color="#312E81" flood-opacity="0.24"/>
    </filter>
  </defs>

  <g filter="url(#clerk-shadow)">
    <rect x="96" y="80" width="832" height="832" rx="204" fill="url(#clerk-tile)"/>
    <rect x="96" y="80" width="832" height="832" rx="204" fill="url(#clerk-sheen)"/>
    <rect x="97.5" y="81.5" width="829" height="829" rx="202.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>
  </g>

